kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Match the fixed NodePorts from nonhelmhelpers/istio-profile.yml
      # so the local gateway can be reached on http://localhost and https://localhost.
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
