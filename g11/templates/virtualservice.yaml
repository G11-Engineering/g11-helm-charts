---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "g11.fullname" . }}
spec:
  hosts:
  - {{ .Values.gateway.hostname }}
  gateways:
  - {{ include "g11.fullname" . }}
  http:
  - name: primary
    route:
    - destination:
        host: frontend
        port:
          number: 3000
      weight: 100
    - destination:
        host: frontend-canary
        port:
          number: 3000
      weight: 0

