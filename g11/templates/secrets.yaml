{{- if .Values.secrets.useSealed }}
# SealedSecret - encrypted, safe to commit to Git
# Requires bitnami-labs/sealed-secrets controller installed
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: g11-app-secrets
  labels:
    {{- include "g11.labels" . | nindent 4 }}
spec:
  encryptedData:
    # All secret values are encrypted with kubeseal
    jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
    asgardeo-client-secret: {{ .Values.secrets.asgardeo.clientSecret | quote }}
    asgardeo-m2m-client-secret: {{ .Values.secrets.asgardeo.m2mClientSecret | quote }}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: g11-app-secrets
      labels:
        {{- include "g11.labels" . | nindent 8 }}
    type: Opaque
    data:
      # Non-sensitive data (plaintext, base64 encoded)
      asgardeo-org-name: {{ .Values.secrets.asgardeo.orgName | b64enc | quote }}
      asgardeo-client-id: {{ .Values.secrets.asgardeo.clientId | b64enc | quote }}
      asgardeo-m2m-client-id: {{ .Values.secrets.asgardeo.m2mClientId | b64enc | quote }}
      asgardeo-issuer: {{ .Values.secrets.asgardeo.issuer | b64enc | quote }}
{{- else }}
# Regular Secret - DO NOT use in production!
# Only for local development
apiVersion: v1
kind: Secret
metadata:
  name: g11-app-secrets
  labels:
    {{- include "g11.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  asgardeo-org-name: {{ .Values.secrets.asgardeo.orgName | quote }}
  asgardeo-client-id: {{ .Values.secrets.asgardeo.clientId | quote }}
  asgardeo-client-secret: {{ .Values.secrets.asgardeo.clientSecret | quote }}
  asgardeo-m2m-client-id: {{ .Values.secrets.asgardeo.m2mClientId | quote }}
  asgardeo-m2m-client-secret: {{ .Values.secrets.asgardeo.m2mClientSecret | quote }}
  asgardeo-issuer: {{ .Values.secrets.asgardeo.issuer | quote }}
{{- end }}
