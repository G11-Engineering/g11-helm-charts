# Default values for istio-bookinfo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# PostgreSQL configuration
postgres:
  # The name of the PostgresCluster resource
  # This should match the Helm release name used when installing the postgres chart
  clusterName: hippo-postgres

# Application secrets configuration
secrets:
  # When true, all secret values below should be encrypted with kubeseal
  # When false, use plaintext values
  useSealed: true
  
  # echo -n "my-jwt-secret" | kubeseal --raw --scope=cluster-wide
  jwtSecret: ""
  
  # Asgardeo OAuth credentials
  asgardeo:
    # These are public, no need to encrypt
    orgName: "g11engineering"
    clientId: "3J34qlpKrGYPvEU8jcaDUfKDxuQa"
    m2mClientId: "Z4uhhDswzZBUBcJX9caVDFLmys0a"
    issuer: "https://api.asgardeo.io/t/g11engineering/oauth2/token"
    
    # echo -n "my-client-secret" | kubeseal --raw --scope=cluster-wide
    clientSecret: ""
    m2mClientSecret: ""

# Microservices image configuration
frontend:
  image:
    repository: jasonmishi/g11-frontend-service
    tag: v1.1.1
    pullPolicy: IfNotPresent

user:
  image:
    repository: jasonmishi/g11-user-service
    tag: v1.0.7
    pullPolicy: IfNotPresent

content:
  image:
    repository: jasonmishi/g11-content-service
    tag: v1.0.2
    pullPolicy: IfNotPresent

category:
  image:
    repository: jasonmishi/g11-category-service
    tag: v1.0.4
    pullPolicy: IfNotPresent

gateway:
  selector: ingressgateway
  hostname: '"*"'
  port: 80  # HTTP port (production: 80, staging: 8081)
  httpsPort: 443  # HTTPS port (production: 443, staging: 8444)
  httpsRedirect: false

  tls:
    enabled: false
    secretName: g11blog-tls
    gatewayNamespace: istio-system
    acme:
      enabled: true
      useStaging: true  # Use Let's Encrypt staging for testing (no rate limits, untrusted certs)
      renewBefore: 720h  # Renew 30 days before expiration
      issuerName: letsencrypt
      issuerKind: ClusterIssuer
