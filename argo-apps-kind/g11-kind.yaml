apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: g11-kind
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Update repoURL / targetRevision if you are demoing from a fork or a branch.
    repoURL: https://github.com/G11-Engineering/g11-helm-charts
    targetRevision: kind-demo-argocd
    path: g11
    helm:
      releaseName: g11
      valueFiles:
        - values-kind.yaml
      parameters:
        - name: postgres.clusterName
          value: hippo-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: g11-kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
