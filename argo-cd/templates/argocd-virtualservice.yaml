apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd-vs
  namespace: argocd
spec:
  hosts:
    - {{ .Values.gateway.hostname }}
  gateways:
    - argocd-gateway
  http:
  {{- if .Values.gateway.tls.enabled }}
    - match:
      - uri:
          prefix: /
        scheme:
          exact: http
      redirect:
        scheme: https
        redirectCode: 301
  {{- end }}
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80

